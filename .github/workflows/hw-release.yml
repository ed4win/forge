name: Hardware Release Build

# 瀹炴満鐗?Forge 鏋勫缓鐭╅樀锛?#   o2_nosd  - -O2锛屾棤 SD 钀界洏锛堜笉璋冪敤 nn::fs锛?  <- 浼樺厛娴嬭瘯
#   o2_sd    - -O2锛屽甫 SD 钀界洏
#   o0_nosd  - -O0锛屾棤 SD 钀界洏锛堟渶鎺ヨ繎瀹樻柟璇箟锛?# 浜х墿缁熶竴杞垚鏈帇缂?NSO锛堝甫姝ｇ‘ SHA256 鍝堝笇琛級銆?
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro

    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y git liblz4-dev zip unzip python3 ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Stamp release version
        run: |
          git tag -f v1.5.1
          git describe --tags --always

      - name: Build matrix
        shell: bash
        run: |
          set -euo pipefail
          source /etc/profile.d/devkit-env.sh
          build() {
            local name="$1"; shift
            echo "=== building $name : $* ==="
            make clean >/dev/null 2>&1 || true
            make -j"$(nproc)" "$@"
            python3 scripts/nso_uncompress.py subsdk.nso "dist/$name.nso"
            sha256sum "dist/$name.nso"
          }
          mkdir -p dist
          build o2_nosd EXTRA_CFLAGS=-DFORGE_SD_LOG=0
          build o2_sd
          build o0_nosd EXTRA_CFLAGS="-DFORGE_SD_LOG=0 -O0"
          grep -c . /dev/null || true

      - name: Package variants
        shell: bash
        run: |
          set -euo pipefail
          for v in o2_nosd o2_sd o0_nosd; do
            d="forge-$v"
            rm -rf "$d"
            mkdir -p "$d/exefs" "$d/romfs/nativeNX/forge"
            cp "dist/$v.nso" "$d/exefs/subsdk9"
            cp main.npdm "$d/exefs/main.npdm"
            cp data/config.ini "$d/romfs/nativeNX/forge/"
            cp -R data/fonts data/shaders "$d/romfs/nativeNX/forge/"
            zip -r "$d.zip" "$d"
            ls -l "$d/exefs/subsdk9"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-hw-matrix
          path: |
            forge-o2_nosd.zip
            forge-o2_sd.zip
            forge-o0_nosd.zip
            dist/
          if-no-files-found: error
